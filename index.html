<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
// viewport-fit=cover is for the iPhone / iPad notch. On Android it opts the page into drawing under the
// system bars (edge-to-edge), and a tablet's taskbar doesn't report its height back as a safe-area
// inset, so bottom controls sat under it. Elsewhere, let the browser keep the app above its bars.
if (!/iPad|iPhone|iPod/.test(navigator.userAgent) && !(navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1))
  document.querySelector('meta[name=viewport]').content = 'width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no';
</script>
<title>PixelPaint</title>
<meta name="description" content="PixelPaint — paint, sketch, take notes and make pixel art in your browser.">
<meta name="theme-color" content="#1b1d23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PixelPaint">
<link rel="icon" href="icons/favicon.svg?v=8" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png?v=8" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png?v=8">
<link rel="manifest" href="manifest.webmanifest">
<style>
/* Boot / update splash: inline so it's the very first thing painted, and it stays until the app
   is ready. Every animation is transform-only, so it keeps playing on the compositor while the
   page is busy starting up. Pyxl walks in place: the sprite atlas (×3) slides behind a window. */
#splash { position: fixed; inset: 0; z-index: 2000; display: grid; place-content: center; justify-items: center; gap: 14px; background: #1b1d23; color: #9aa1b1; font: 13px 'Pixelify Sans', system-ui, sans-serif; transition: opacity .45s; }
#splash.out { opacity: 0; pointer-events: none; }
.sp-win { --p: var(--sp-p, 3px); width: calc(52 * var(--p)); height: calc(54 * var(--p)); overflow: hidden; animation: sp-bob .3s step-end infinite alternate; will-change: transform; }
.sp-strip { width: calc(1034 * var(--p)); height: calc(59 * var(--p)); background: url(assets/pyxl-pixel.webp) 0 0 / 100% 100% no-repeat; image-rendering: pixelated; transform: translate(calc(-133 * var(--p)), calc(-5 * var(--p))); animation: sp-walk .6s infinite; will-change: transform; }
.sp-brand { font-weight: 700; font-size: 22px; letter-spacing: .5px; color: #cbe4ff; } .sp-brand i { font-style: normal; color: #ffd23f; }
.sp-bar { width: 180px; height: 4px; border-radius: 2px; background: #2b2f39; overflow: hidden; }
.sp-bar i { display: block; height: 100%; width: 100%; background: linear-gradient(90deg, #a445ff, #3b7bff, #17c06b, #ffd23f, #ff3b47); transform-origin: left; transform: scaleX(var(--from, 0)); animation: sp-fill 7s cubic-bezier(.12, .7, .3, 1) forwards; will-change: transform; }
.sp-msg { margin: 0; min-height: 1.4em; }
@keyframes sp-walk { 0%, 100% { transform: translate(calc(-133 * var(--p)), calc(-5 * var(--p))); } 33.3% { transform: translate(calc(-232 * var(--p)), calc(-5 * var(--p))); } 66.6% { transform: translate(calc(-181 * var(--p)), calc(-5 * var(--p))); } }
.sp-strip { animation-timing-function: step-end; }
@keyframes sp-bob { to { transform: translateY(calc(-1 * var(--p))); } }
/* one steady fill: fast at first, easing toward 92% until the app says it's ready, then to 100% */
@keyframes sp-fill { from { transform: scaleX(var(--from, 0)); } to { transform: scaleX(.92); } }
@media (prefers-reduced-motion: reduce) { .sp-win { animation: none; } }   /* keep her walk and the progress bar; drop the bob */
</style>
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script>/* splash art pixel = 3 CSS px, rounded to whole device pixels (no mixels) */ document.documentElement.style.setProperty('--sp-p', Math.max(1, Math.round(3 * devicePixelRatio)) / devicePixelRatio + 'px');</script>
<script type="module" src="js/main.js"></script>
</head>
<body data-mode="paint">
<div id="splash" aria-live="polite"><div class="sp-win"><div class="sp-strip"></div></div><div class="sp-brand">Pixel<i>Paint</i></div><div class="sp-bar"><i></i></div><p class="sp-msg">Loading…</p></div>
<script>
// Coming back from an update: carry on the same loading bar from where it stopped.
try { const u = sessionStorage.getItem('pp.updated'); if (u) { document.querySelector('#splash .sp-msg').textContent = 'Updating PixelPaint…'; document.querySelector('#splash .sp-bar i').style.setProperty('--from', Math.min(0.9, +u || 0.6)); } } catch (e) {}
// Safety net: if starting ever stalls, offer a reload - never let the user into a half-loaded app.
setTimeout(() => { const s = document.getElementById('splash'); if (s && !s.hidden && !s.classList.contains('out')) { s.querySelector('.sp-msg').textContent = 'Taking longer than usual… tap to reload'; s.onclick = () => location.reload(); } }, 12000);
</script>
<div id="app">
  <header class="menubar" id="menubar"></header>
  <div class="optionsbar" id="optionsbar"></div>
  <main class="workspace" id="workspace">
    <aside class="dock dock-left" id="dockLeft"><div class="dock-panels"></div><div class="mascot-slot" id="mascotSlot"></div></aside>
    <div class="stage-col"><div class="doc-tabs" id="docTabs" hidden></div><div class="stage" id="stage"><canvas id="view"></canvas></div></div>
    <aside class="dock dock-right" id="dockRight"><div class="dock-resizer"></div><div class="dock-panels"></div></aside>
    <div class="float-layer" id="floatLayer"></div>
    <div id="zen" class="zen"></div>
  </main>
  <section id="timeline" class="timeline"></section>
  <section id="notes" class="notes" hidden></section>
  <footer class="statusbar" id="statusbar"></footer>
</div>
</body>
</html>
