<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PixelPaint Studio</title>
<meta name="theme-color" content="#0f1117">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="css/studio.css">
<script type="module" src="js/main.js"></script>
</head>
<body data-mode="studio">
<div id="app">
  <header class="menubar" id="menubar"></header>
  <div class="optionsbar" id="optionsbar"></div>
  <main class="workspace" id="workspace">
    <aside class="dock dock-left" id="dockLeft"><div class="dock-panels"></div><div class="mascot-slot" id="mascotSlot"></div></aside>
    <div class="stage" id="stage"><canvas id="view"></canvas></div>
    <aside class="dock dock-right" id="dockRight"><div class="dock-resizer"></div><div class="dock-panels"></div></aside>
    <div class="float-layer" id="floatLayer"></div>
  </main>
  <footer class="statusbar" id="statusbar"></footer>
</div>
<div id="zen" class="zen"></div>
<div id="notes" class="notes" hidden></div>
</body>
</html>
