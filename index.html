<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>PixelPaint</title>
<meta name="description" content="PixelPaint — paint, sketch, take notes and make pixel art in your browser.">
<meta name="theme-color" content="#1b1d23">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PixelPaint">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="css/fonts.css">
<link rel="stylesheet" href="css/app.css">
<script type="module" src="js/main.js"></script>
</head>
<body data-mode="paint">
<div id="app">
  <header class="menubar" id="menubar"></header>
  <div class="optionsbar" id="optionsbar"></div>
  <main class="workspace" id="workspace">
    <aside class="dock dock-left" id="dockLeft"><div class="dock-panels"></div><div class="mascot-slot" id="mascotSlot"></div></aside>
    <div class="stage" id="stage"><canvas id="view"></canvas></div>
    <aside class="dock dock-right" id="dockRight"><div class="dock-resizer"></div><div class="dock-panels"></div></aside>
    <div class="float-layer" id="floatLayer"></div>
    <div id="zen" class="zen"></div>
  </main>
  <section id="timeline" class="timeline"></section>
  <section id="notes" class="notes" hidden></section>
  <footer class="statusbar" id="statusbar"></footer>
</div>
</body>
</html>
